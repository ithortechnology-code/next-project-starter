extensions:
  basicauth/openobserve:
    client_auth:
      username: ${env:ZO_ROOT_USER_EMAIL}
      password: ${env:ZO_ROOT_USER_PASSWORD}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp_http/openobserve:
    endpoint: http://openobserve:5080/api/default
    auth:
      authenticator: basicauth/openobserve

service:
  extensions: [basicauth/openobserve]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/openobserve]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/openobserve]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/openobserve]
