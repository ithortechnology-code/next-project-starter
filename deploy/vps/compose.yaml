name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      OBSERVE_DOMAIN: ${OBSERVE_DOMAIN:?Set OBSERVE_DOMAIN in .env}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [edge]

  web:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}-web:${IMAGE_TAG:?Set IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_URL: http://api:4000
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [edge]

  api:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX in .env}-api:${IMAGE_TAG:?Set IMAGE_TAG in .env}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      WEB_ORIGIN: https://${WEB_DOMAIN:?Set WEB_DOMAIN in .env}
      OTEL_SERVICE_NAME: starter-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=${DEPLOYMENT_ENVIRONMENT:?Set DEPLOYMENT_ENVIRONMENT in .env}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in .env}
      SMTP_SECURE: ${SMTP_SECURE:?Set SMTP_SECURE in .env}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM in .env}
    expose: ["4000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [edge, data, telemetry]

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.1.2
    restart: unless-stopped
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?Set ZO_ROOT_USER_EMAIL in .env}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Set ZO_ROOT_USER_PASSWORD in .env}
    expose: ["5080"]
    volumes:
      - openobserve_data:/data
    networks: [edge, telemetry]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?Set ZO_ROOT_USER_EMAIL in .env}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Set ZO_ROOT_USER_PASSWORD in .env}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - openobserve
    expose: ["4317", "4318"]
    networks: [telemetry]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

networks:
  edge:
  data:
    internal: true
  telemetry:
    internal: true

volumes:
  postgres_data:
  openobserve_data:
  caddy_data:
  caddy_config:
