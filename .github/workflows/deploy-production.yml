name: Promote image to production VPS

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character commit SHA from a successful main CI run"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOYMENT_PROVIDER == 'vps' && vars.ENABLE_VPS_DEPLOYMENTS == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate selected commit is on main
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$COMMIT_SHA" origin/main
          CI_CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f head_sha="$COMMIT_SHA" -F per_page=1 \
            --jq '.workflow_runs[0].conclusion // "missing"')"
          [[ "$CI_CONCLUSION" == "success" ]] || {
            echo "No successful main CI run was found for $COMMIT_SHA." >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - name: Deploy approved image to production VPS
        env:
          DEPLOY_TAG: sha-${{ inputs.commit_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: ./deploy/vps/remote-deploy.sh "$DEPLOY_TAG"
