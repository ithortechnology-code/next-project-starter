name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["24", "26"]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.node-version == '24'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: matrix.node-version == '26'
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run test:email --workspace=@starter/api
      - run: npm run test:auth --workspace=@starter/mobile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  auth-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: starter_auth_test
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: auth-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8025/api/v1/info >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Mailpit did not become ready" >&2
          exit 1
      - run: npm run db:migrate --workspace=@starter/api
        env:
          DATABASE_URL: postgresql://starter:auth-test-only@localhost:5432/starter_auth_test
      - run: npm run test:auth --workspace=@starter/api
        env:
          AUTH_TEST_DATABASE_URL: postgresql://starter:auth-test-only@localhost:5432/starter_auth_test
          MAILPIT_API_URL: http://localhost:8025
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          EMAIL_FROM: no-reply@example.test

      - run: npx playwright install --with-deps chromium
      - run: npm run test:auth --workspace=@starter/web
        env:
          AUTH_TEST_DATABASE_URL: postgresql://starter:auth-test-only@localhost:5432/starter_auth_test
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          EMAIL_FROM: no-reply@example.test
          MAILPIT_API_URL: http://localhost:8025

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Set image prefix
        run: echo "prefix=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}-api:sha-${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.prefix }}-web:sha-${{ github.sha }}
